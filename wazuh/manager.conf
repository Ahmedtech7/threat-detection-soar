<!--
  Add inside <ossec_config> of /var/ossec/etc/ossec.conf on the manager.
  1. Native response: Wazuh drops the IP itself on SSH brute force (rule 100106).
  2. SOAR: every alert level >= 10 goes to custom-soar, which enriches the
     source IP with AbuseIPDB and VirusTotal and blocks it only if it is
     known-malicious (see responder/custom_soar.py).
-->
<active-response>
  <command>firewall-drop</command>
  <location>local</location>
  <rules_id>100106</rules_id>
  <timeout>3600</timeout>
</active-response>

<integration>
  <name>custom-soar</name>
  <level>10</level>
  <alert_format>json</alert_format>
</integration>
